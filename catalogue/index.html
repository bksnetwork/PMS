<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Card Catalogue</title><style>body{background:#101b2b;color:#f3f7ff;font:16px system-ui;margin:0}header,main{max-width:1100px;margin:auto;padding:20px}a{color:#80e3cd}button,select,input{padding:10px;border-radius:8px;margin:4px;background:#263d57;color:white;border:1px solid #5b7794}button{cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.card,.stat{background:#1d3047;padding:14px;border-radius:12px}.card img{width:100%;height:220px;object-fit:contain}.stats{display:flex;flex-wrap:wrap;gap:12px}.stat{min-width:145px}.stat strong{display:block;font-size:24px}.muted{color:#c4d0e0}.warning{padding:12px;background:#533e27;border-radius:10px}</style></head><body><header><a href="../index.html">← Collection Hub</a><h1>The Card Catalogue</h1><p>Set checklists, collection values and trade inventory</p></header><main><div class="warning" id="status">Loading catalogue data. Prices and card variants must be verified against the source before purchasing.</div><div class="stats" id="stats"></div><p><select id="set"></select><select id="tier"><option value="basic">Basic Set</option><option value="master">Master Set</option><option value="grand">Grand Master Set</option></select><select id="filter"><option value="all">All</option><option value="missing">Missing</option><option value="owned">Owned</option></select><input id="search" placeholder="Search cards"></p><p><button id="export">Export backup</button><label>Import backup <input id="import" type="file" accept="application/json"></label></p><div class="cards" id="cards"></div></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c])),money=n=>'$'+n.toFixed(2);let data=[],owned={},binder={};try{owned=JSON.parse(localStorage.getItem('cc.owned.v2')||'{}');binder=JSON.parse(localStorage.getItem('cc.binder.v2')||'{}')}catch{}const save=()=>{localStorage.setItem('cc.owned.v2',JSON.stringify(owned));localStorage.setItem('cc.binder.v2',JSON.stringify(binder))};const key=(s,c,p)=>s.id+':'+c.pid+':'+p.t;function entries(s){return(s.cards||[]).flatMap(c=>(c.prints||[]).filter(p=>{if($('tier').value==='grand')return true;if($('tier').value==='master')return c.role!=='grand';let n=String(c.num).match(/^(\d+)\/(\d+)/);return c.role==='main'&&(!n||+n[1]<=+n[2])&&p===(c.prints.find(x=>x.t==='Normal')||c.prints[0])}).map(p=>({c,p,k:key(s,c,p)})))}function render(){const s=data.find(x=>x.id===$('set').value);if(!s)return;const all=entries(s),have=all.filter(x=>owned[x.k]>0),missing=all.filter(x=>!owned[x.k]),known=x=>typeof x.p.m==='number'&&Number.isFinite(x.p.m),total=a=>a.filter(known).reduce((v,x)=>v+x.p.m,0);$('stats').innerHTML=[['Owned value',money(total(have))],['Missing cost',money(total(missing))],['Completion',have.length+'/'+all.length],['Unpriced entries',all.filter(x=>!known(x)).length],['Trade binder',money(all.reduce((v,x)=>v+(binder[x.k]||0)*(known(x)?x.p.m:0),0))]].map(x=>'<div class="stat">'+esc(x[0])+'<strong>'+esc(x[1])+'</strong></div>').join('');let q=$('search').value.toLowerCase(),f=$('filter').value;const visible=all.filter(x=>(f==='all'||(f==='owned'?!!owned[x.k]:!owned[x.k]))&&(x.c.name+' '+x.c.num+' '+x.p.t).toLowerCase().includes(q));$('cards').innerHTML=visible.map(x=>'<article class="card"><img loading="lazy" alt="'+esc(x.c.name)+'" src="'+esc(x.c.img)+'"><h3>'+esc(x.c.name)+'</h3><p class="muted">'+esc(x.c.num)+' · '+esc(x.p.t)+' · '+esc(x.c.rarity)+'</p><strong>'+(known(x)?money(x.p.m):'Price unavailable')+'</strong><p><label><input type="checkbox" data-own="'+esc(x.k)+'" '+(owned[x.k]?'checked':'')+'> Owned</label></p><p>Trade copies: <input style="width:55px" type="number" min="0" data-trade="'+esc(x.k)+'" value="'+(binder[x.k]||0)+'"></p><a target="_blank" rel="noopener noreferrer" href="https://www.tcgplayer.com/product/'+encodeURIComponent(x.c.pid)+'">View exact product on TCGplayer ↗</a></article>').join('')||'<p>No matching cards.</p>'}document.addEventListener('change',e=>{if(e.target.dataset.own){owned[e.target.dataset.own]=e.target.checked?1:0;save();render()}else if(e.target.dataset.trade){binder[e.target.dataset.trade]=Math.max(0,parseInt(e.target.value)||0);save();render()}else if(['set','tier','filter'].includes(e.target.id))render()});$('search').addEventListener('input',render);$('export').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({version:2,owned,binder},null,2)],{type:'application/json'}));a.href=u;a.download='card-catalogue-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('import').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!d||typeof d.owned!=='object'||Array.isArray(d.owned)||typeof d.binder!=='object'||Array.isArray(d.binder))throw Error();if(!confirm('Replace local collection with imported backup?'))return;owned=d.owned;binder=d.binder;save();render()}catch{alert('Invalid backup file')}};async function init(){try{let r=await fetch('data/index.json');if(!r.ok)throw Error();let ix=await r.json();data=(await Promise.all(ix.map(async i=>{let r=await fetch('data/'+encodeURIComponent(i.id)+'.json');if(!r.ok)throw Error();return r.json()}))).filter(s=>Array.isArray(s.cards));if(!data.length)throw Error();$('set').innerHTML=data.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.name)+'</option>').join('');$('status').textContent='Prices are estimates from the last successful data refresh, not live checkout quotes. Grand Master includes all configured related promo groups; completeness requires source verification.';render()}catch{$('status').textContent='Card data has not been synchronized. Run the catalogue data workflow before using this tracker.'}}init();
</script></body></html>
