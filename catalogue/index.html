<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Card Catalogue</title><style>body{background:#101b2b;color:#f3f7ff;font:16px system-ui;margin:0}header,main{max-width:1100px;margin:auto;padding:20px}a{color:#80e3cd}button,select,input{padding:10px;border-radius:8px;margin:4px;background:#263d57;color:white;border:1px solid #5b7794}button{cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.card,.stat{background:#1d3047;padding:14px;border-radius:12px}.card img{width:100%;height:220px;object-fit:contain}.stats{display:flex;flex-wrap:wrap;gap:12px}.stat{min-width:145px}.stat strong{display:block;font-size:24px}.muted{color:#c4d0e0}.warning{padding:12px;background:#533e27;border-radius:10px} .card label{display:block;margin:8px 0}.card label input,.card label select{max-width:90%;box-sizing:border-box}.card img{height:200px}.placeholder{height:200px;display:grid;place-items:center;background:#30465d;border-radius:10px} .card-image-button{display:block;width:100%;padding:0;margin:0;background:transparent;border:0;cursor:zoom-in}.card-image-button img{width:100%;height:260px;object-fit:contain}.card-image-button:focus-visible{outline:3px solid #7debd5}.card{transition:transform .15s,border-color .15s;border:1px solid #3d5972}.card:hover{transform:translateY(-2px);border-color:#7debd5}.viewer{position:fixed;inset:0;z-index:9999;background:rgba(4,9,18,.94);display:none;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}.viewer.open{display:flex}.viewer-content{display:flex;flex-direction:column;align-items:center;max-width:min(96vw,1050px);max-height:96vh}.viewer img{max-width:min(88vw,800px);max-height:78vh;object-fit:contain;box-shadow:0 15px 55px #000}.viewer-toolbar{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px}.viewer button{font-size:20px;min-width:46px}.viewer-caption{text-align:center;color:white}.viewer-close{position:absolute;right:20px;top:12px}.viewer-error{padding:25px;color:#fff}.card-image-button img:not([src]){display:none}@media(max-width:600px){.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{padding:9px}.card h3{font-size:15px}.card-image-button img{height:190px}.viewer img{max-width:94vw;max-height:72vh}} </style></head><body><header><a href="../index.html">← Collection Hub</a><h1>The Card Catalogue</h1><p>Set checklists, collection values and trade inventory</p></header><main><div class="warning" id="status">Loading catalogue data. Prices and card variants must be verified against the source before purchasing.</div><div class="stats" id="stats"></div><p><select id="set"></select><select id="tier"><option value="basic">Basic Set</option><option value="master">Master Set</option><option value="grand">Grand Master Set</option></select><select id="filter"><option value="all">All</option><option value="missing">Missing</option><option value="owned">Owned</option><option value="trade">For Trade</option></select><select id="sort"><option value="number">Card number</option><option value="name">Name</option><option value="price">Highest market price</option></select><input id="search" placeholder="Search cards"></p><p><button id="export">Export backup</button><label>Import backup <input id="import" type="file" accept="application/json"></label></p><p id="disclaimer" class="muted"></p><p><span id="count"></span> <button id="prev">Previous</button> <span id="pages"></span> <button id="next">Next</button><input type="hidden" id="page" value="1"><span id="saved" class="muted"></span></p><div class="cards" id="cards"></div></main><div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Card image viewer" aria-hidden="true"><button class="viewer-close" id="viewer-close" aria-label="Close image viewer">✕</button><div class="viewer-content"><img id="viewer-image" alt=""><div id="viewer-error" class="viewer-error" hidden>Image unavailable</div><div class="viewer-toolbar"><button id="viewer-prev" aria-label="Previous card">←</button><span id="viewer-position"></span><button id="viewer-next" aria-label="Next card">→</button></div><div class="viewer-caption" id="viewer-caption"></div></div></div><script src="app.js" defer></script></body></html>
