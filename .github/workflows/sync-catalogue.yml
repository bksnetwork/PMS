name: Sync Card Catalogue
on:
  push:
    branches: [main]
    paths:
      - 'catalogue/sets.json'
      - 'tools/sync_catalogue.py'
      - 'tools/discover_catalogue.py'
      - 'tools/cache_catalogue_images.py'
      - 'tools/cache_delta_from_checklist.py'
      - 'catalogue/data/delta-reign.json'
      - '.github/workflows/sync-catalogue.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover target set groups
        run: python tools/discover_catalogue.py
      - name: Update card and price data
        run: python tools/sync_catalogue.py
      - name: Cache card images in repository
        run: python tools/cache_catalogue_images.py
      - name: Recover Delta Reign artwork from numbered checklist
        continue-on-error: true
        run: python tools/cache_delta_from_checklist.py
      - name: Validate catalogue snapshots
        run: python tools/verify_catalogue.py
      - name: Commit only validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue/data catalogue/images
          git diff --cached --quiet || (git commit -m "Refresh catalogue card and price data" && git push origin HEAD:main)
